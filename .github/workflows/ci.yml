name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # Warnings are errors on Windows (MSVC /W4 is clean); GCC / Clang show theirs without failing the build
            configure: cmake -B build -A x64 -DBREAKOUTCNC_WARNINGS_AS_ERRORS=ON
            # Multi-config generator: binaries land in build/Release
            bin_dir: build/Release
            package: build/BreakoutCNC-*-win64.zip
          # Linux / macOS build exactly like the release workflow, so every push checks the release packages:
          # - Linux on the oldest supported Ubuntu with libstdc++ linked in, so the binaries run on most distros
          #   from 2022 on (glibc 2.35+)
          # - macOS as a universal binary (Apple Silicon + Intel), macOS 11+
          - name: Linux
            os: ubuntu-22.04
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            bin_dir: build
            package: build/BreakoutCNC-*-linux-*.tar.gz
          - name: macOS
            os: macos-latest
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            bin_dir: build
            package: build/BreakoutCNC-*-macos-*.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libgl-dev libudev-dev libusb-1.0-0-dev \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # Every unit test registered in CMakeLists.txt (script engine, VFD, GRBL-family boards on the emulator,
      # regression tests). They never touch hardware (rnr_hid_test is a hardware tool and is not a test).
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Start both GUI apps (simulator, no USB access), run the demo job for ~4 s and exit: catches startup
      # crashes and OpenGL / window problems the unit tests cannot see. Linux only: Windows runners have no
      # OpenGL 3.3, and the macOS runners are VMs without a hardware OpenGL renderer, which GLFW requires on macOS
      # ("NSGL: Failed to find a suitable pixel format").
      - name: Startup smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" ./BreakoutMill --smoke-test
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" ./BreakoutCut --smoke-test

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BreakoutCNC-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  # AddressSanitizer + UndefinedBehaviorSanitizer over the unit tests: raw sockets, hand-written parsers and several
  # threads are where memory errors hide
  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libgl-dev libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --parallel --target script_engine_test huanyang_vfd_test board_tests regression_tests deploy_scripts deploy_resources

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
